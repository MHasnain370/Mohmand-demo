       <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15e & 15f</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <style>
        body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: white;
    padding: 30px;
}

/* Product Container */
.product-card{
    position: relative;
    display: inline-block;
    margin-right: 40px;
    border: 1px solid #ddd;
}

/* Product Image */
.product-card img{
    width: 250px;
    height: 300px;
    object-fit: cover;
    display: block;
}

/* Discount Badge */
.discount{
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: black;
    color: white;
    padding: 8px 12px;
    font-size: 14px;
}

/* Bottom Overlay */
.overlay{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 80px;
    background-color: rgba(255,255,255,0.8);

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Button */
.overlay button{
    padding: 10px 20px;
    background-color: white;
    border: 1px solid black;
    cursor: pointer;
    font-size: 16px;
}

.overlay button:hover{
    background-color: black;
    color: white;
}
body{
    margin: 0px;
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
}
.video-box{
     width: 320px;
    height: 180px;
    background-color: grey;
    position: fixed;
    bottom: 20px;
    right: 20px;
}
.close-btn{
    width: 40px;
    height: 40px;
    background: black;
    color: white;
     border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    cursor: pointer;
    position: absolute;
    top: -18px;
    left: -18px;

}
.time{
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: black;
    color: white;
    padding: 5px 8px;
    font-size: 14px;
    font-weight: bold;
}

     </style>
  <!-- Exercise 15e -->
  <div class="product-card">
    <img src="images/jacket.jfif" alt="Shirt">
    <div class="discount">20% OFF</div>
  </div>

  <!-- Exercise 15f -->
  <div class="product-card">
    <img src="images/images jacket.jfif" alt="Shirt">
    <div class="discount">20% OFF</div>

    <div class="overlay">
      <button>Add to Cart</button>
    </div>
  </div>
       <div class="video-box">
           <div class="close-btn">X</div>
           <div class="time">
            0:29
           </div>
       </div>
</body>
